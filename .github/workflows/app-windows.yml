# Fabrique l'installeur Windows de l'app à chaque envoi qui touche app/.
# Le mainteneur le télécharge dans l'onglet Actions du dépôt.
name: App Windows

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - run: npm ci

      # --nocapture : le rapport du PC de GitHub s'affiche dans le journal.
      - name: Tests du moteur
        run: cargo test -p moteur -- --nocapture

      - name: Installeur
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: opn-display-windows
          path: app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
