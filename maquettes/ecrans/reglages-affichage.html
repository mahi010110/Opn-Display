<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affichage · Opn-Display</title>
<link rel="stylesheet" href="../style.css">
</head>
<body class="app">

<header class="barre">
  <span class="marque">Opn-Display</span>
  <nav class="menu" aria-label="Menu">
    <a href="#"><i class="ic i-labs"></i>Labs</a>
    <a href="#"><i class="ic i-cours"></i>Cours</a>
    <a href="#"><i class="ic i-pannes"></i>Pannes</a>
    <a href="#"><i class="ic i-progression"></i>Progression</a>
  </nav>
  <div class="barre-fin">
    <a href="#" aria-current="page"><i class="ic i-reglages"></i>Réglages</a>
  </div>
</header>

<div class="lab-barre">
  <h1 class="lab-nom">Réglages</h1>
</div>

<main class="page reglages">
  <nav class="oc-window" aria-label="Réglages">
    <div class="oc-window__body oc-window__body--flush">
      <ul class="liste-nav">
        <li><a href="#"><i class="ic i-brancher"></i>Brancher l'IA</a></li>
        <li><a href="#"><i class="ic i-reglages"></i>Régler l'IA</a></li>
        <li><a href="#"><i class="ic i-memoire"></i>Sa mémoire</a></li>
        <li><a href="#"><i class="ic i-journal"></i>Son journal</a></li>
        <li><a href="#"><i class="ic i-images"></i>Images</a></li>
        <li><a href="#"><i class="ic i-poste"></i>Ton PC</a></li>
        <li><a href="#" aria-current="page"><i class="ic i-affichage"></i>Affichage</a></li>
      </ul>
    </div>
  </nav>

  <section class="oc-window">
    <header class="oc-window__bar oc-window__bar--accent">
      <h2 class="oc-window__title">Affichage</h2>
    </header>
    <div class="oc-window__body bloc">
      <fieldset class="oc-fieldset bloc">
        <legend>Thème</legend>
        <div class="choix" role="radiogroup" aria-label="Thème">
          <label class="choix-ligne"><span class="oc-radio"><input type="radio" name="t" checked></span>Automatique<span class="mono">comme Windows</span></label>
          <label class="choix-ligne"><span class="oc-radio"><input type="radio" name="t"></span>Clair</label>
          <label class="choix-ligne"><span class="oc-radio"><input type="radio" name="t"></span>Sombre</label>
        </div>
      </fieldset>
      <fieldset class="oc-fieldset bloc">
        <legend>Taille du texte</legend>
        <div class="segments" role="group" aria-label="Taille du texte">
          <button aria-pressed="true">100 %</button>
          <button aria-pressed="false">125 %</button>
          <button aria-pressed="false">150 %</button>
        </div>
      </fieldset>
    </div>
  </section>
</main>

<footer class="etat">
  <span>RAM du PC<span class="jauge" aria-hidden="true"><i class="plein"></i><i class="plein"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>24,3 Go libres sur 32</span>
  <span class="etat-fin">IA : avec accord sur le PC</span>
</footer>

</body>
</html>
